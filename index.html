<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4e8c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="贷后看板">
<title>贷后管理看板</title>
<style>
  :root {
    --bg: #f2f4f7; --card: #fff; --text: #1d2330; --sub: #6b7280; --line: #e5e7eb;
    --primary: #1f4e8c; --primary-soft: #e8eef8;
    --ok: #15803d; --ok-soft: #dcfce7;
    --warn: #b45309; --warn-soft: #fef3c7;
    --bad: #c62828; --bad-soft: #fde8e8;
    --gray-soft: #f1f2f4;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif; }
  body { padding-bottom: calc(68px + env(safe-area-inset-bottom)); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }

  header { position: sticky; top: 0; z-index: 10; background: var(--primary); color: #fff;
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px; }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; text-align: center; }
  .qbar { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  .qbar button { background: rgba(255,255,255,.15); border: 0; color: #fff; width: 40px; height: 34px;
    border-radius: 8px; font-size: 18px; }
  .qbar button:disabled { opacity: .3; }
  .qbar select { background: transparent; border: 0; color: #fff; font-size: 16px; font-weight: 600;
    text-align: center; text-align-last: center; -webkit-appearance: none; appearance: none; padding: 4px 8px; }
  .qbar select option { color: #000; }
  .qtag { font-size: 12px; opacity: .85; text-align: center; }

  main { padding: 12px 16px; max-width: 640px; margin: 0 auto; }
  .card { background: var(--card); border-radius: 12px; padding: 14px; margin-bottom: 12px;
    box-shadow: 0 1px 2px rgba(0,0,0,.05); }

  .summary .row { display: flex; gap: 10px; }
  .stat { flex: 1; text-align: center; padding: 6px 0; }
  .stat .num { font-size: 24px; font-weight: 700; }
  .stat .num small { font-size: 14px; color: var(--sub); font-weight: 500; }
  .stat .lbl { font-size: 12px; color: var(--sub); }
  .bar { height: 6px; background: var(--gray-soft); border-radius: 3px; overflow: hidden; margin-top: 4px; }
  .bar i { display: block; height: 100%; background: var(--primary); border-radius: 3px; }
  .deadline { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 13px;
    color: var(--sub); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .deadline b.red { color: var(--bad); }

  .chips { display: flex; gap: 8px; margin: 4px 0 12px; overflow-x: auto; }
  .chip { flex: none; border: 1px solid var(--line); background: var(--card); padding: 5px 14px; border-radius: 16px;
    font-size: 14px; color: var(--sub); }
  .chip.on { background: var(--primary); border-color: var(--primary); color: #fff; }

  .client { position: relative; }
  .client.urgent { border-left: 4px solid var(--bad); background: #fff7f7; }
  .client .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .client .name { font-weight: 600; font-size: 16px; }
  .client .meta { font-size: 12px; color: var(--sub); margin-top: 2px; }
  .flag { flex: none; font-size: 12px; color: #fff; background: var(--bad); padding: 1px 8px; border-radius: 10px; }
  .pills { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
  .pill { border-radius: 8px; padding: 6px 4px; text-align: center; font-size: 13px; }
  .pill span { display: block; font-size: 11px; opacity: .75; }
  .s-ok { background: var(--ok-soft); color: var(--ok); }
  .s-mid { background: var(--warn-soft); color: var(--warn); }
  .s-bad { background: var(--bad-soft); color: var(--bad); }
  .s-none { background: var(--gray-soft); color: var(--sub); }
  .note { font-size: 12px; color: var(--sub); margin-top: 8px; white-space: pre-wrap; word-break: break-all; }

  .empty { text-align: center; color: var(--sub); padding: 30px 0; }
  .btn { display: block; width: 100%; border: 0; border-radius: 10px; padding: 12px; font-size: 16px;
    background: var(--primary); color: #fff; margin-top: 10px; }
  .btn.ghost { background: var(--primary-soft); color: var(--primary); }
  .btn.danger { background: var(--bad-soft); color: var(--bad); }
  .hint { font-size: 13px; color: var(--sub); }
  h3 { margin: 0 0 6px; font-size: 16px; }

  nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; background: #fff;
    border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  nav button { flex: 1; border: 0; background: none; padding: 8px 0 6px; font-size: 12px; color: var(--sub); }
  nav button .ic { display: block; font-size: 20px; line-height: 1.2; }
  nav button.on { color: var(--primary); font-weight: 600; }

  /* 底部弹出编辑面板 */
  .mask { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 30; display: none; }
  .mask.show { display: block; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; background: #fff; border-radius: 16px 16px 0 0;
    max-height: 90vh; overflow-y: auto; padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
    transform: translateY(105%); transition: transform .22s ease; max-width: 640px; margin: 0 auto; }
  .sheet.show { transform: none; }
  .sheet h2 { margin: 0 0 4px; font-size: 18px; }
  .field { margin-top: 14px; }
  .field > label { display: block; font-size: 13px; color: var(--sub); margin-bottom: 6px; }
  .field input, .field textarea, .field select { width: 100%; border: 1px solid var(--line); border-radius: 8px;
    padding: 10px; background: #fff; font-size: 16px; }
  .field textarea { min-height: 70px; resize: vertical; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { flex: 1; border: 0; background: #fff; padding: 10px 0; font-size: 15px; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on.c0 { background: var(--gray-soft); color: var(--text); font-weight: 600; }
  .seg button.on.c1 { background: var(--warn-soft); color: var(--warn); font-weight: 600; }
  .seg button.on.c2 { background: var(--ok-soft); color: var(--ok); font-weight: 600; }
  .seg.loan button.on.c0 { background: var(--ok-soft); color: var(--ok); }
  .seg.loan button.on.c2 { background: var(--bad-soft); color: var(--bad); }
  .group { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 4px; }
  .group-title { font-weight: 600; margin-top: 10px; }
  .actions { display: flex; gap: 10px; }
  .actions .btn { flex: 1; }

  .toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: rgba(0,0,0,.8);
    color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 14px; z-index: 50; display: none;
    max-width: 85%; text-align: center; }
  .list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0;
    border-bottom: 1px solid var(--line); }
  .list-item:last-child { border-bottom: 0; }
  .list-item .r { color: var(--primary); font-size: 14px; flex: none; }
</style>
</head>
<body>

<header>
  <h1>贷后管理看板</h1>
  <div class="qbar" id="qbar">
    <button id="qPrev" aria-label="上一季度">‹</button>
    <div>
      <select id="qSelect" aria-label="选择季度"></select>
      <div class="qtag" id="qTag"></div>
    </div>
    <button id="qNext" aria-label="下一季度">›</button>
  </div>
</header>

<main id="view"></main>

<nav>
  <button data-tab="board" class="on"><span class="ic">📋</span>看板</button>
  <button data-tab="clients"><span class="ic">🏢</span>客户</button>
  <button data-tab="backup"><span class="ic">💾</span>备份</button>
</nav>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  // ========== 基础常量 ==========
  var STORE_KEY = 'daihou_board_v1';
  var VISIT = ['未开始', '已约', '已完成'];
  var LOAN = ['正常', '关注', '有风险'];
  var REPORT = ['未写', '草稿', '已提交'];
  var METHODS = ['按月付息、到期还本', '按季付息、到期还本', '等额本息', '等额本金', '分期还本', '到期一次还本付息'];
  var WARN_DAYS = 15; // 季末前多少天开始标红

  // ========== 日期 / 季度工具 ==========
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function fmt(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parse(s) { if (!s) return null; var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function today() { var d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function qKey(d) { return d.getFullYear() + 'Q' + (Math.floor(d.getMonth() / 3) + 1); }
  function qStart(k) { return new Date(+k.slice(0, 4), (+k.slice(5) - 1) * 3, 1); }
  function qEnd(k) { return new Date(+k.slice(0, 4), +k.slice(5) * 3, 0); }
  function qLabel(k) { return k.slice(0, 4) + '年 第' + '一二三四'[+k.slice(5) - 1] + '季度'; }
  function qShift(k, n) { var s = qStart(k); return qKey(new Date(s.getFullYear(), s.getMonth() + n * 3, 1)); }
  function daysBetween(a, b) { return Math.round((b - a) / 86400000); }

  // ========== 演示数据 ==========
  function demoData() {
    var cur = qKey(today()), prev = qShift(cur, -1);
    var t = today();
    function ago(n) { var d = new Date(t); d.setDate(d.getDate() - n); return fmt(d); }
    function inPrev(day) { var s = qStart(prev); s.setDate(s.getDate() + day); return fmt(s); }
    var y = t.getFullYear();
    var clients = [
      { id: 'c1', name: '华东精密机械有限公司', amount: 3000, start: (y - 1) + '-03-15', end: (y + 1) + '-03-14', method: '按月付息、到期还本' },
      { id: 'c2', name: '江南新材料科技股份有限公司', amount: 5000, start: (y - 1) + '-08-20', end: (y + 2) + '-08-19', method: '等额本金' },
      { id: 'c3', name: '海川物流集团有限公司', amount: 1200, start: y + '-01-10', end: (y + 1) + '-01-09', method: '按季付息、到期还本' },
      { id: 'c4', name: '恒泰建筑工程有限公司', amount: 8000, start: (y - 2) + '-11-05', end: (y + 1) + '-11-04', method: '分期还本' },
      { id: 'c5', name: '绿源食品贸易有限公司', amount: 800, start: y + '-05-28', end: (y + 1) + '-05-27', method: '到期一次还本付息' }
    ];
    var records = {};
    records[prev] = {
      c1: { visit: { s: 2, date: inPrev(20), note: '生产正常，订单饱满，在手订单约2.3亿元。' }, loan: { s: 0, note: '' }, report: { s: 2 } },
      c2: { visit: { s: 2, date: inPrev(35), note: '新产线已投产，产能利用率约80%。' }, loan: { s: 0, note: '' }, report: { s: 2 } },
      c3: { visit: { s: 2, date: inPrev(50), note: '运输业务量同比下降约10%。' }, loan: { s: 1, note: '应收账款增加，回款周期拉长，持续关注。' }, report: { s: 1 } },
      c4: { visit: { s: 1, date: inPrev(80), note: '' }, loan: { s: 2, note: '上游项目回款困难，已出现欠薪纠纷，需上报。' }, report: { s: 0 } },
      c5: { visit: { s: 2, date: inPrev(60), note: '经营稳定。' }, loan: { s: 0, note: '' }, report: { s: 2 } }
    };
    records[cur] = {
      c1: { visit: { s: 2, date: ago(5), note: '实地走访厂区，设备运转正常，水电费无异常。' }, loan: { s: 0, note: '' }, report: { s: 1 } },
      c2: { visit: { s: 1, date: '', note: '已约下周二上午拜访财务总监。' }, loan: { s: 0, note: '' }, report: { s: 0 } },
      c3: { visit: { s: 0, date: '', note: '' }, loan: { s: 1, note: '继续跟踪应收账款回收情况。' }, report: { s: 0 } },
      c4: { visit: { s: 2, date: ago(2), note: '与实控人面谈，正在协调项目回款。' }, loan: { s: 2, note: '已提交风险预警。' }, report: { s: 2 } },
      c5: { visit: { s: 0, date: '', note: '' }, loan: { s: 0, note: '' }, report: { s: 0 } }
    };
    return { clients: clients, records: records };
  }

  // ========== 存储 ==========
  var db;
  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) { db = JSON.parse(raw); if (db && db.clients && db.records) return; }
    } catch (e) {}
    db = { clients: [], records: {} }; // 首次打开为空白，可在“备份”页载入演示数据
    save();
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(db)); }
    catch (e) { toast('保存失败：浏览器可能处于无痕模式'); }
  }
  function rec(k, id) {
    var q = db.records[k] || (db.records[k] = {});
    var r = q[id] || (q[id] = {});
    r.visit = r.visit || { s: 0, date: '', note: '' };
    r.loan = r.loan || { s: 0, note: '' };
    r.report = r.report || { s: 0 };
    return r;
  }
  function peek(k, id) { // 只读，不创建空记录
    var r = (db.records[k] || {})[id] || {};
    return { visit: r.visit || { s: 0, date: '', note: '' }, loan: r.loan || { s: 0, note: '' }, report: r.report || { s: 0 } };
  }

  // ========== 状态 ==========
  var state = { tab: 'board', q: qKey(today()), filter: 'all' };

  function quarterRange() {
    var cur = qKey(today()), min = cur;
    db.clients.forEach(function (c) { var s = parse(c.start); if (s && qKey(s) < min) min = qKey(s); });
    Object.keys(db.records).forEach(function (k) { if (k < min) min = k; });
    var list = [], k = min;
    while (k <= cur) { list.push(k); k = qShift(k, 1); }
    return list.reverse(); // 新的在前
  }
  function activeIn(c, k) { // 该季度内贷款存续
    var s = parse(c.start), e = parse(c.end);
    return (!s || s <= qEnd(k)) && (!e || e >= qStart(k));
  }
  function isDone(r) { return r.visit.s === 2 && r.report.s === 2; }

  function quarterInfo(k) {
    var end = qEnd(k), left = daysBetween(today(), end);
    return { left: left, warn: left <= WARN_DAYS, past: left < 0, end: end };
  }

  // ========== 渲染：看板 ==========
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function money(n) { return +n ? (+n).toLocaleString('zh-CN') + ' 万元' : '金额未填'; }

  function renderBoard() {
    var k = state.q, qi = quarterInfo(k);
    var rows = db.clients.filter(function (c) { return activeIn(c, k); }).map(function (c) {
      var r = peek(k, c.id);
      return { c: c, r: r, urgent: qi.warn && !isDone(r) };
    });
    var n = rows.length;
    var visited = rows.filter(function (x) { return x.r.visit.s === 2; }).length;
    var reported = rows.filter(function (x) { return x.r.report.s === 2; }).length;
    var risky = rows.filter(function (x) { return x.r.loan.s > 0; }).length;
    var urgentN = rows.filter(function (x) { return x.urgent; }).length;

    rows.sort(function (a, b) {
      return (b.urgent - a.urgent) || (b.r.loan.s - a.r.loan.s) || (isDone(a.r) - isDone(b.r)) || a.c.name.localeCompare(b.c.name, 'zh');
    });
    var shown = rows.filter(function (x) {
      if (state.filter === 'todo') return !isDone(x.r);
      if (state.filter === 'risk') return x.r.loan.s > 0;
      return true;
    });

    function pct(a) { return n ? Math.round(a / n * 100) : 0; }
    var dl;
    if (qi.past) dl = '本季度已结束（' + fmt(qi.end) + '）';
    else dl = '距季末 <b class="' + (qi.warn ? 'red' : '') + '">' + qi.left + '</b> 天（' + fmt(qi.end) + '）';

    var h = '<div class="card summary"><div class="row">' +
      '<div class="stat"><div class="num">' + visited + '<small>/' + n + '</small></div><div class="lbl">贷后访问已完成</div><div class="bar"><i style="width:' + pct(visited) + '%"></i></div></div>' +
      '<div class="stat"><div class="num">' + reported + '<small>/' + n + '</small></div><div class="lbl">贷后报告已提交</div><div class="bar"><i style="width:' + pct(reported) + '%"></i></div></div>' +
      '<div class="stat"><div class="num" style="color:' + (risky ? 'var(--bad)' : 'inherit') + '">' + risky + '</div><div class="lbl">关注 / 有风险</div></div>' +
      '</div><div class="deadline"><span>' + dl + '</span>' +
      (urgentN ? '<b class="red">⚠ ' + urgentN + ' 家' + (qi.past ? '未完成' : '临期未完成') + '</b>' : (n && visited === n && reported === n ? '<b style="color:var(--ok)">✓ 全部完成</b>' : '')) +
      '</div></div>';

    h += '<div class="chips">' +
      chip('all', '全部 ' + n) + chip('todo', '未完成 ' + rows.filter(function (x) { return !isDone(x.r); }).length) +
      chip('risk', '关注/风险 ' + risky) + '</div>';

    if (!n) h += '<div class="empty">' + (db.clients.length ? '该季度没有存续贷款客户' : '还没有客户，先把管户名单加进来吧') +
      '<br><br><button class="btn" data-act="batch">批量添加客户（粘贴名单）</button><button class="btn ghost" data-act="add">+ 逐个添加客户</button></div>';
    else if (!shown.length) h += '<div class="empty">没有符合条件的客户</div>';

    shown.forEach(function (x) {
      var c = x.c, r = x.r;
      var vCls = ['s-none', 's-mid', 's-ok'][r.visit.s];
      var lCls = ['s-ok', 's-mid', 's-bad'][r.loan.s];
      var pCls = ['s-none', 's-mid', 's-ok'][r.report.s];
      var notes = [];
      if (r.visit.date) notes.push('访问日期：' + r.visit.date);
      if (r.visit.note) notes.push('访问要点：' + r.visit.note);
      if (r.loan.note) notes.push('备注：' + r.loan.note);
      h += '<div class="card client' + (x.urgent ? ' urgent' : '') + '" data-edit="' + c.id + '">' +
        '<div class="top"><div><div class="name">' + esc(c.name) + '</div>' +
        '<div class="meta">' + money(c.amount) + ' · 到期 ' + esc(c.end || '未填') + '</div></div>' +
        (x.urgent ? '<span class="flag">' + (qi.past ? '逾期未完成' : '临期未完成') + '</span>' : '') + '</div>' +
        '<div class="pills">' +
        '<div class="pill ' + vCls + '"><span>贷后访问</span>' + VISIT[r.visit.s] + '</div>' +
        '<div class="pill ' + lCls + '"><span>贷款情况</span>' + LOAN[r.loan.s] + '</div>' +
        '<div class="pill ' + pCls + '"><span>贷后报告</span>' + REPORT[r.report.s] + '</div>' +
        '</div>' + (notes.length ? '<div class="note">' + esc(notes.join('\n')) + '</div>' : '') + '</div>';
    });
    if (n) h += '<p class="hint" style="text-align:center">点击客户卡片即可更新本季度进度</p>';
    return h;
  }
  function chip(v, t) { return '<button class="chip' + (state.filter === v ? ' on' : '') + '" data-filter="' + v + '">' + t + '</button>'; }

  // ========== 渲染：客户 ==========
  function renderClients() {
    var h = '<div class="card"><h3>客户列表（' + db.clients.length + ' 家）</h3>';
    if (!db.clients.length) h += '<div class="empty">还没有客户</div>';
    db.clients.forEach(function (c) {
      h += '<div class="list-item" data-client="' + c.id + '"><div><div class="name" style="font-weight:600">' + esc(c.name) + '</div>' +
        '<div class="hint">' + money(c.amount) + (c.method ? ' · ' + esc(c.method) : '') + '</div>' +
        '<div class="hint">放款 ' + esc(c.start || '—') + ' ～ 到期 ' + esc(c.end || '—') + '</div></div><span class="r">编辑 ›</span></div>';
    });
    h += '<button class="btn" data-act="add">+ 添加客户</button><button class="btn ghost" data-act="batch">批量添加（粘贴名单）</button></div>';
    return h;
  }

  // ========== 渲染：备份 ==========
  function renderBackup() {
    return '<div class="card"><h3>导出 Excel</h3><p class="hint">包含客户列表、当前所选季度进度、全部季度历史记录三张表，可用 Excel / WPS 打开。</p>' +
      '<button class="btn" data-act="xlsx">📥 导出 Excel（.xlsx）</button></div>' +
      '<div class="card"><h3>备份与恢复</h3><p class="hint">数据只保存在本手机的这个浏览器里。清理浏览器数据或换手机前，请先下载备份文件；需要时再“从备份恢复”。</p>' +
      '<button class="btn ghost" data-act="json">下载备份文件（.json）</button>' +
      '<button class="btn ghost" data-act="import">从备份文件恢复</button>' +
      '<input type="file" id="fileIn" accept=".json,application/json" style="display:none"></div>' +
      '<div class="card"><h3>其他</h3>' +
      '<button class="btn danger" data-act="demo">载入演示数据（会覆盖当前数据）</button>' +
      '<button class="btn danger" data-act="clear">清空全部数据（开始正式使用）</button>' +
      '<p class="hint" style="margin-top:12px">提示：微信里打开时无法下载文件，请点右上角“…”选择“在浏览器打开”。</p></div>';
  }

  // ========== 主渲染 ==========
  var $ = function (id) { return document.getElementById(id); };
  function render() {
    var qs = quarterRange();
    if (qs.indexOf(state.q) < 0) state.q = qs[0];
    var sel = $('qSelect');
    sel.innerHTML = qs.map(function (k) { return '<option value="' + k + '"' + (k === state.q ? ' selected' : '') + '>' + qLabel(k) + '</option>'; }).join('');
    var idx = qs.indexOf(state.q);
    $('qPrev').disabled = idx >= qs.length - 1;
    $('qNext').disabled = idx <= 0;
    $('qTag').textContent = state.q === qKey(today()) ? '本季度' : '往季记录';
    $('qbar').style.display = state.tab === 'clients' ? 'none' : '';

    $('view').innerHTML = state.tab === 'board' ? renderBoard() : state.tab === 'clients' ? renderClients() : renderBackup();
    document.querySelectorAll('nav button').forEach(function (b) { b.classList.toggle('on', b.dataset.tab === state.tab); });
  }

  // ========== 弹出面板 ==========
  function openSheet(html) { $('sheet').innerHTML = html; $('mask').classList.add('show'); $('sheet').classList.add('show'); $('sheet').scrollTop = 0; }
  function closeSheet() { $('mask').classList.remove('show'); $('sheet').classList.remove('show'); }
  function seg(name, labels, val, extra) {
    return '<div class="seg ' + (extra || '') + '" data-seg="' + name + '">' + labels.map(function (l, i) {
      return '<button type="button" class="c' + i + (i === val ? ' on' : '') + '" data-v="' + i + '">' + l + '</button>';
    }).join('') + '</div>';
  }
  function segVal(name) { var b = $('sheet').querySelector('[data-seg="' + name + '"] .on'); return b ? +b.dataset.v : 0; }

  function editProgress(id) {
    var c = db.clients.filter(function (x) { return x.id === id; })[0]; if (!c) return;
    var r = peek(state.q, id);
    openSheet('<h2>' + esc(c.name) + '</h2><div class="hint">' + qLabel(state.q) + ' · ' + money(c.amount) + ' · ' + esc(c.method || '') + '</div>' +
      '<div class="group"><div class="group-title">① 贷后访问</div>' +
      '<div class="field">' + seg('visit', VISIT, r.visit.s) + '</div>' +
      '<div class="field"><label>访问日期</label><input type="date" id="fDate" value="' + esc(r.visit.date) + '"></div>' +
      '<div class="field"><label>访问要点</label><textarea id="fVNote" placeholder="经营情况、财务变化、抵押物情况等">' + esc(r.visit.note) + '</textarea></div></div>' +
      '<div class="group"><div class="group-title">② 贷款情况</div>' +
      '<div class="field">' + seg('loan', LOAN, r.loan.s, 'loan') + '</div>' +
      '<div class="field"><label>备注</label><textarea id="fLNote" placeholder="风险信号、处置措施等">' + esc(r.loan.note) + '</textarea></div></div>' +
      '<div class="group"><div class="group-title">③ 贷后报告</div>' +
      '<div class="field">' + seg('report', REPORT, r.report.s) + '</div></div>' +
      '<div class="actions"><button class="btn ghost" data-act="close">取消</button><button class="btn" data-act="saveP" data-id="' + id + '">保存</button></div>');
  }
  function saveProgress(id) {
    var r = rec(state.q, id);
    r.visit.s = segVal('visit'); r.visit.date = $('fDate').value; r.visit.note = $('fVNote').value.trim();
    if (r.visit.s === 2 && !r.visit.date) r.visit.date = fmt(today());
    r.loan.s = segVal('loan'); r.loan.note = $('fLNote').value.trim();
    r.report.s = segVal('report');
    save(); closeSheet(); render(); toast('已保存');
  }

  function editClient(id) {
    var c = db.clients.filter(function (x) { return x.id === id; })[0] || { id: '', name: '', amount: '', start: '', end: '', method: '' };
    openSheet('<h2>' + (id ? '编辑客户' : '添加客户') + '</h2>' +
      '<div class="field"><label>企业名称 *</label><input id="cName" value="' + esc(c.name) + '" placeholder="如：某某科技有限公司"></div>' +
      '<div class="field"><label>贷款金额（万元）</label><input id="cAmt" type="number" inputmode="decimal" value="' + esc(c.amount) + '"></div>' +
      '<div class="field"><label>放款日</label><input id="cStart" type="date" value="' + esc(c.start) + '"></div>' +
      '<div class="field"><label>到期日</label><input id="cEnd" type="date" value="' + esc(c.end) + '"></div>' +
      '<div class="field"><label>还款方式</label><input id="cMethod" list="methods" value="' + esc(c.method) + '" placeholder="可选择或自行填写">' +
      '<datalist id="methods">' + METHODS.map(function (m) { return '<option value="' + m + '">'; }).join('') + '</datalist></div>' +
      '<div class="actions"><button class="btn ghost" data-act="close">取消</button><button class="btn" data-act="saveC" data-id="' + c.id + '">保存</button></div>' +
      (id ? '<button class="btn danger" data-act="delC" data-id="' + c.id + '">删除该客户</button>' : ''));
  }
  function saveClient(id) {
    var name = $('cName').value.trim();
    if (!name) { toast('请填写企业名称'); return; }
    var s = $('cStart').value, e = $('cEnd').value;
    if (s && e && e < s) { toast('到期日不能早于放款日'); return; }
    var c = id ? db.clients.filter(function (x) { return x.id === id; })[0] : null;
    if (!c) { c = { id: 'c' + Date.now().toString(36) }; db.clients.push(c); }
    c.name = name; c.amount = parseFloat($('cAmt').value) || 0; c.start = s; c.end = e; c.method = $('cMethod').value.trim();
    save(); closeSheet(); render(); toast('已保存');
  }
  function delClient(id) {
    if (!confirm('确定删除该客户及其所有季度记录？')) return;
    db.clients = db.clients.filter(function (x) { return x.id !== id; });
    Object.keys(db.records).forEach(function (k) { delete db.records[k][id]; });
    save(); closeSheet(); render(); toast('已删除');
  }

  function batchAdd() {
    openSheet('<h2>批量添加客户</h2><div class="hint">把企业名称粘贴到下面，每行一家。已存在的同名客户会自动跳过。贷款金额、日期等可之后在“客户”页逐个补充。</div>' +
      '<div class="field"><textarea id="bNames" style="min-height:220px" placeholder="例如：\n某某科技有限公司\n某某贸易有限公司"></textarea></div>' +
      '<label class="hint" style="display:flex;gap:8px;align-items:center;margin-top:12px"><input type="checkbox" id="bReplace"' + (db.clients.length ? '' : ' disabled') + '> 先删除现有全部客户及其记录（如演示数据）</label>' +
      '<div class="actions"><button class="btn ghost" data-act="close">取消</button><button class="btn" data-act="saveB">添加</button></div>');
  }
  function saveBatch() {
    var names = $('bNames').value.split(/[\r\n]+/).map(function (x) { return x.replace(/^\s*(\d+[.、．)\s]+)?/, '').trim(); }).filter(Boolean);
    if (!names.length) { toast('请先粘贴企业名称'); return; }
    if ($('bReplace').checked) {
      if (!confirm('将删除现有 ' + db.clients.length + ' 家客户及全部季度记录，确定吗？')) return;
      db = { clients: [], records: {} };
    }
    var have = {}, added = 0;
    db.clients.forEach(function (c) { have[c.name] = 1; });
    names.forEach(function (n, i) {
      if (have[n]) return;
      have[n] = 1; added++;
      db.clients.push({ id: 'c' + Date.now().toString(36) + i, name: n, amount: 0, start: '', end: '', method: '' });
    });
    save(); closeSheet(); state.tab = 'clients'; render(); toast('已添加 ' + added + ' 家客户' + (added < names.length ? '，跳过 ' + (names.length - added) + ' 家重复' : ''));
  }

  // ========== 提示 ==========
  var tt;
  function toast(msg) { var t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(tt); tt = setTimeout(function () { t.style.display = 'none'; }, 2200); }

  // ========== 文件下载 ==========
  function download(blob, name) {
    if (/MicroMessenger/i.test(navigator.userAgent)) { toast('微信内无法下载，请点右上角“…”→“在浏览器打开”'); return; }
    var url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; a.style.display = 'none';
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 4000);
    toast('已开始下载：' + name);
  }
  function stamp() { var d = new Date(); return fmt(d).replace(/-/g, '') + '_' + pad(d.getHours()) + pad(d.getMinutes()); }

  // ========== 生成 .xlsx（无需联网、无第三方库） ==========
  var CRC_T = (function () { var t = [], c; for (var n = 0; n < 256; n++) { c = n; for (var k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  function crc32(u8) { var c = 0xFFFFFFFF; for (var i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
  function zip(files) { // 仅存储（不压缩）的标准 zip
    var enc = new TextEncoder(), chunks = [], central = [], offset = 0;
    files.forEach(function (f) {
      var name = enc.encode(f.name), data = enc.encode(f.data), crc = crc32(data);
      var lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
      lh.setUint16(8, 0, true); lh.setUint16(10, 0, true); lh.setUint16(12, 33, true);
      lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true);
      lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
      chunks.push(new Uint8Array(lh.buffer), name, data);
      var ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
      ch.setUint16(10, 0, true); ch.setUint16(12, 0, true); ch.setUint16(14, 33, true);
      ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true);
      ch.setUint16(28, name.length, true); ch.setUint32(42, offset, true);
      central.push(new Uint8Array(ch.buffer), name);
      offset += 30 + name.length + data.length;
    });
    var cdSize = central.reduce(function (s, a) { return s + a.length; }, 0);
    var end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
    end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
    return new Blob(chunks.concat(central, [new Uint8Array(end.buffer)]), { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  }
  function xesc(s) { return String(s == null ? '' : s).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '').replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function col(i) { var s = ''; i++; while (i) { var m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; }
  function sheetXml(rows, widths) {
    var x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      '<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>';
    widths.forEach(function (w, i) { x += '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + w + '" customWidth="1"/>'; });
    x += '</cols><sheetData>';
    rows.forEach(function (row, ri) {
      x += '<row r="' + (ri + 1) + '">';
      row.forEach(function (v, ci) {
        var ref = col(ci) + (ri + 1), st = ri === 0 ? ' s="1"' : ' s="2"';
        if (typeof v === 'number') x += '<c r="' + ref + '"' + st + '><v>' + v + '</v></c>';
        else x += '<c r="' + ref + '"' + st + ' t="inlineStr"><is><t xml:space="preserve">' + xesc(v) + '</t></is></c>';
      });
      x += '</row>';
    });
    return x + '</sheetData></worksheet>';
  }
  function buildXlsx(sheets) {
    var ns = 'http://schemas.openxmlformats.org/', files = [];
    files.push({ name: '[Content_Types].xml', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="' + ns + 'package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
      '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
      sheets.map(function (s, i) { return '<Override PartName="/xl/worksheets/sheet' + (i + 1) + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'; }).join('') + '</Types>' });
    files.push({ name: '_rels/.rels', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="' + ns + 'package/2006/relationships">' +
      '<Relationship Id="rId1" Type="' + ns + 'officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>' });
    files.push({ name: 'xl/workbook.xml', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="' + ns + 'spreadsheetml/2006/main" xmlns:r="' + ns + 'officeDocument/2006/relationships"><sheets>' +
      sheets.map(function (s, i) { return '<sheet name="' + xesc(s.name) + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>'; }).join('') + '</sheets></workbook>' });
    files.push({ name: 'xl/_rels/workbook.xml.rels', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="' + ns + 'package/2006/relationships">' +
      sheets.map(function (s, i) { return '<Relationship Id="rId' + (i + 1) + '" Type="' + ns + 'officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + (i + 1) + '.xml"/>'; }).join('') +
      '<Relationship Id="rId' + (sheets.length + 1) + '" Type="' + ns + 'officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>' });
    files.push({ name: 'xl/styles.xml', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="' + ns + 'spreadsheetml/2006/main">' +
      '<fonts count="2"><font><sz val="11"/><name val="等线"/></font><font><b/><sz val="11"/><name val="等线"/></font></fonts>' +
      '<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFDCE6F2"/><bgColor indexed="64"/></patternFill></fill></fills>' +
      '<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border><left style="thin"><color rgb="FFBFBFBF"/></left><right style="thin"><color rgb="FFBFBFBF"/></right><top style="thin"><color rgb="FFBFBFBF"/></top><bottom style="thin"><color rgb="FFBFBFBF"/></bottom><diagonal/></border></borders>' +
      '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
      '<cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' +
      '<xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1"/>' +
      '<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf></cellXfs>' +
      '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>' });
    sheets.forEach(function (s, i) { files.push({ name: 'xl/worksheets/sheet' + (i + 1) + '.xml', data: sheetXml(s.rows, s.widths) }); });
    return zip(files);
  }

  function progressRow(k, c) {
    var r = peek(k, c.id);
    return [c.name, VISIT[r.visit.s], r.visit.date || '', r.visit.note || '', LOAN[r.loan.s], r.loan.note || '', REPORT[r.report.s], isDone(r) ? '是' : '否'];
  }
  var PHEAD = ['企业名称', '贷后访问', '访问日期', '访问要点', '贷款情况', '情况备注', '贷后报告', '本季是否完成'];
  var PW = [30, 10, 12, 40, 10, 36, 10, 12];
  function exportXlsx() {
    var s1 = [['企业名称', '贷款金额（万元）', '放款日', '到期日', '还款方式']].concat(db.clients.map(function (c) { return [c.name, +c.amount || '', c.start || '', c.end || '', c.method || '']; }));
    var k = state.q;
    var s2 = [PHEAD].concat(db.clients.filter(function (c) { return activeIn(c, k); }).map(function (c) { return progressRow(k, c); }));
    var s3 = [['季度'].concat(PHEAD)];
    quarterRange().forEach(function (q) {
      db.clients.forEach(function (c) { if (activeIn(c, q) && (db.records[q] || {})[c.id]) s3.push([qLabel(q)].concat(progressRow(q, c))); });
    });
    download(buildXlsx([
      { name: '客户列表', rows: s1, widths: [30, 16, 12, 12, 22] },
      { name: k + '进度', rows: s2, widths: PW },
      { name: '全部季度记录', rows: s3, widths: [16].concat(PW) }
    ]), 'daihou_' + stamp() + '.xlsx');
  }
  function exportJson() {
    download(new Blob([JSON.stringify({ app: 'daihou-board', version: 1, exportedAt: new Date().toISOString(), data: db }, null, 2)], { type: 'application/json' }), 'daihou_backup_' + stamp() + '.json');
  }
  function importJson(file) {
    var fr = new FileReader();
    fr.onload = function () {
      try {
        var o = JSON.parse(fr.result), d = o.data || o;
        if (!Array.isArray(d.clients) || typeof d.records !== 'object') throw 0;
        if (!confirm('将用备份文件中的 ' + d.clients.length + ' 家客户数据覆盖当前数据，确定吗？')) return;
        db = { clients: d.clients, records: d.records || {} }; save(); state.q = qKey(today()); render(); toast('恢复成功');
      } catch (e) { toast('文件格式不正确'); }
    };
    fr.readAsText(file);
  }

  // ========== 事件 ==========
  document.addEventListener('click', function (e) {
    var t = e.target.closest('button, [data-edit], [data-client], #mask');
    if (!t) return;
    if (t.id === 'mask') return closeSheet();
    if (t.dataset.tab) { state.tab = t.dataset.tab; render(); window.scrollTo(0, 0); return; }
    if (t.dataset.filter) { state.filter = t.dataset.filter; render(); return; }
    if (t.dataset.edit) return editProgress(t.dataset.edit);
    if (t.dataset.client) return editClient(t.dataset.client);
    if (t.dataset.v != null && t.parentNode.dataset.seg) {
      t.parentNode.querySelectorAll('button').forEach(function (b) { b.classList.remove('on'); });
      t.classList.add('on');
      if (t.parentNode.dataset.seg === 'visit' && t.dataset.v === '2' && !$('fDate').value) $('fDate').value = fmt(today());
      return;
    }
    if (t.id === 'qPrev' || t.id === 'qNext') {
      var qs = quarterRange(), i = qs.indexOf(state.q) + (t.id === 'qPrev' ? 1 : -1);
      if (qs[i]) { state.q = qs[i]; render(); }
      return;
    }
    switch (t.dataset.act) {
      case 'close': closeSheet(); break;
      case 'saveP': saveProgress(t.dataset.id); break;
      case 'add': state.tab = 'clients'; render(); editClient(''); break;
      case 'batch': batchAdd(); break;
      case 'saveB': saveBatch(); break;
      case 'saveC': saveClient(t.dataset.id); break;
      case 'delC': delClient(t.dataset.id); break;
      case 'xlsx': exportXlsx(); break;
      case 'json': exportJson(); break;
      case 'import': $('fileIn').click(); break;
      case 'demo': if (confirm('将清除当前所有数据并恢复为演示数据，确定吗？')) { db = demoData(); save(); state.q = qKey(today()); render(); toast('已恢复演示数据'); } break;
      case 'clear': if (confirm('将清空全部客户和记录（建议先导出备份），确定吗？')) { db = { clients: [], records: {} }; save(); state.q = qKey(today()); render(); toast('已清空，可在“客户”页添加客户'); } break;
    }
  });
  document.addEventListener('change', function (e) {
    if (e.target.id === 'qSelect') { state.q = e.target.value; render(); }
    if (e.target.id === 'fileIn' && e.target.files[0]) { importJson(e.target.files[0]); e.target.value = ''; }
  });

  // ========== 一键导入链接：网址 #add=[{n:名称,a:金额,s:放款日,e:到期日,m:还款方式}] ==========
  // 名单只在链接的 # 之后，不会发送到服务器，也不在代码仓库里
  function importFromLink() {
    var m = location.hash.match(/^#add=(.+)$/);
    if (!m) return;
    history.replaceState(null, '', location.pathname + location.search);
    var list;
    try { list = JSON.parse(decodeURIComponent(m[1])); if (!Array.isArray(list)) throw 0; } catch (e) { toast('导入链接不完整，请复制完整链接再试'); return; }
    var demo = demoData().clients, isDemo = db.clients.length && db.clients.every(function (c) {
      return demo.some(function (d) { return d.id === c.id && d.name === c.name; });
    });
    var byName = {}, added = 0, updated = 0;
    if (isDemo) db = { clients: [], records: {} };
    db.clients.forEach(function (c) { byName[c.name] = c; });
    list.forEach(function (x, i) {
      var name = String(x.n || '').trim(); if (!name) return;
      var c = byName[name];
      if (c) updated++; else { c = byName[name] = { id: 'c' + Date.now().toString(36) + i, name: name, amount: 0, start: '', end: '', method: '' }; db.clients.push(c); added++; }
      if (x.a != null) c.amount = +x.a || 0;
      if (x.s) c.start = x.s;
      if (x.e) c.end = x.e;
      if (x.m) c.method = x.m;
    });
    save();
    state.tab = 'clients';
    toast('已导入：新增 ' + added + ' 家' + (updated ? '，更新 ' + updated + ' 家' : '') + (isDemo ? '（已清除演示数据）' : ''));
  }

  load();
  importFromLink();
  render();
  window.addEventListener('hashchange', function () { if (/^#add=/.test(location.hash)) { importFromLink(); render(); } });
})();
</script>
</body>
</html>
